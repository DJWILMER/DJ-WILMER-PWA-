<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a2a6c"/>
            <stop offset="50%" style="stop-color:#16213e"/>
            <stop offset="100%" style="stop-color:#0f3460"/>
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFD700"/>
            <stop offset="100%" style="stop-color:#FF8C00"/>
        </linearGradient>
        <radialGradient id="glowGrad" cx="40%" cy="30%" r="70%">
            <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.25"/>
            <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
        </radialGradient>
    </defs>

    <!-- Fondo -->
    <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

    <!-- Glow -->
    <circle cx="256" cy="256" r="250" fill="url(#glowGrad)"/>

    <!-- Montañas -->
    <path d="M0,420 Q100,340 180,360 Q280,300 340,340 Q420,290 512,330 L512,512 L0,512 Z" fill="#FFD700" opacity="0.12"/>
    <path d="M0,450 Q150,380 260,410 Q380,360 512,400 L512,512 L0,512 Z" fill="#FF8C00" opacity="0.15"/>

    <!-- Cruz -->
    <g transform="translate(256,240)">
        <path d="M0,-120 L0,40 M-50,-30 L50,-30 M0,40 L0,120" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" fill="none"/>
        <path d="M0,-120 L0,40 M-50,-30 L50,-30" stroke="#FFD700" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.35"/>
    </g>

    <!-- Disco de radio --> 
    <g transform="translate(256,380)">
        <circle cx="0" cy="0" r="55" fill="url(#goldGrad)"/>
        <circle cx="0" cy="0" r="42" fill="#16213e"/>
        <text x="0" y="6" text-anchor="middle" fill="url(#goldGrad)" font-family="Arial, sans-serif" font-size="28" font-weight="bold">989</text>
        <text x="0" y="32" text-anchor="middle" fill="#FFD700" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">FM</text>
    </g>

    <!-- Ondas de radio -->
    <g stroke="#FFD700" stroke-width="5" fill="none" opacity="0.5" stroke-linecap="round">
        <path d="M196,140 A85,50 0 0,1 256,140"/>
        <path d="M316,140 A85,50 0 0,1 256,140"/>
    </g>
</svg>